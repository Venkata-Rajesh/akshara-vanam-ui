<main class="password-page">
  <section class="password-card">
    @if (submitted()) {
      <h1>Check your email</h1>
      <p>If an account exists for that address, you will receive password reset instructions.</p>
      <a routerLink="/login">Return to sign in</a>
    } @else {
      <h1>Forgot password?</h1>
      <p>Enter your email address and we will send reset instructions.</p>
      <form #form="ngForm" (ngSubmit)="submit()">
        <label>Email address<input type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required email /></label>
        @if (error()) { <p class="error">{{ error() }}</p> }
        <button type="submit" [disabled]="form.invalid || isLoading()">{{ isLoading() ? 'Sending...' : 'Send reset link' }}</button>
      </form>
      <a routerLink="/login">Back to sign in</a>
    }
  </section>
</main>
