<main class="password-page">
  <section class="password-card">
    <h1>Set a new password</h1>
    <p>Choose a strong password with at least six characters.</p>
    <form #form="ngForm" (ngSubmit)="submit()">
      <label>New password<input type="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required minlength="6" /></label>
      <label>Confirm password<input type="password" name="confirmation" [ngModel]="confirmation()" (ngModelChange)="confirmation.set($event)" required minlength="6" /></label>
      @if (error()) { <p class="error">{{ error() }}</p> }
      <button type="submit" [disabled]="form.invalid || isLoading()">{{ isLoading() ? 'Updating...' : 'Update password' }}</button>
    </form>
    <a routerLink="/login">Back to sign in</a>
  </section>
</main>
