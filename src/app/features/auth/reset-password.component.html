<main class="password-page">
  <section class="password-card">
    <h1>Set a new password</h1>
    <p>Use at least 12 characters and enter the same password twice.</p>
    <form #form="ngForm" (ngSubmit)="submit()">
      <label class="password-field" for="new-password">
        New password
        <span class="password-input-wrap">
          <input
            id="new-password"
            [type]="passwordVisible() ? 'text' : 'password'"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="updatePassword($event)"
            required
            minlength="12"
            autocomplete="new-password"
            #newPasswordInput="ngModel"
          />
          <app-password-visibility-toggle
            [visible]="passwordVisible()"
            fieldLabel="password"
            (visibleChange)="passwordVisible.set($event)"
          />
        </span>
        @if (password() && password().length < 12) {
          <span class="error" role="status">Password must be at least 12 characters.</span>
        } @else if (newPasswordInput.touched && newPasswordInput.invalid) {
          <span class="error" role="status">Enter a new password.</span>
        }
      </label>
      <label class="password-field" for="confirm-password">
        Confirm password
        <span class="password-input-wrap">
          <input
            id="confirm-password"
            [type]="confirmationVisible() ? 'text' : 'password'"
            name="confirmation"
            [ngModel]="confirmation()"
            (ngModelChange)="updateConfirmation($event)"
            required
            minlength="12"
            autocomplete="new-password"
            #confirmationInput="ngModel"
          />
          <app-password-visibility-toggle
            [visible]="confirmationVisible()"
            fieldLabel="confirmation password"
            (visibleChange)="confirmationVisible.set($event)"
          />
        </span>
        @if (confirmationInput.touched && confirmationInput.invalid) {
          <span class="error" role="status">Confirm your password.</span>
        }
      </label>
      @if (confirmation() && password() !== confirmation()) {
        <p class="error" role="alert">Passwords do not match.</p>
      } @else if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button
        type="submit"
        [disabled]="form.invalid || password() !== confirmation() || isLoading()"
      >
        {{ isLoading() ? 'Updating...' : 'Update password' }}
      </button>
    </form>
    <a routerLink="/login">Back to sign in</a>
  </section>
</main>
