<article
  class="quote-card"
  (click)="onCardClick()"
  tabindex="0"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()"
>
  <div class="card-glow"></div>

  <!-- Ambient Watermark -->
  <span class="watermark-mark" aria-hidden="true">“</span>

  <div class="card-header">
    <span class="quote-mark">“</span>
    <div class="card-actions">
      <button
        type="button"
        class="action-icon-btn"
        (click)="onEditClick($event)"
        title="Edit quote"
        aria-label="Edit quote"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>
      <button
        type="button"
        class="action-icon-btn danger"
        (click)="onDeleteClick($event)"
        title="Delete quote"
        aria-label="Delete quote"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
      <button
        type="button"
        class="copy-btn"
        [class.copied]="isCopied()"
        (click)="onCopyClick($event)"
        [title]="isCopied() ? 'Copied!' : 'Copy to clipboard'"
        aria-label="Copy quote"
      >
        @if (isCopied()) {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        }
      </button>
    </div>
  </div>

  <blockquote class="quote-content">
    {{ quote().content }}
  </blockquote>

  <div class="card-footer">
    <div class="author-info">
      <div class="author-avatar">{{ quote().author.charAt(0) }}</div>
      <div class="author-meta">
        <span class="author-name">{{ quote().author }}</span>
        @if (quote().dateAdded) {
          <span class="quote-date">{{ quote().dateAdded }}</span>
        }
      </div>
    </div>

    <div class="tag-list">
      @for (tag of quote().tags; track tag) {
        <span class="tag-badge">#{{ tag }}</span>
      }
    </div>
  </div>
</article>
