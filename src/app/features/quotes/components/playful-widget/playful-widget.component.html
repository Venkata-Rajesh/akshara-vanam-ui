<div class="playground" #playground (mousemove)="onPlaygroundMouseMove($event)">
  <div class="bg-effects">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="card">
    <div class="card-badge">Playground Widget</div>
    <h1 class="title">Do you like this app?</h1>
    <p class="subtitle">Choose an answer — but the "No" button is a little shy.</p>

    <div class="buttons">
      <button type="button" class="btn yes" (click)="onYesClick()">❤️ Yes, absolutely!</button>
    </div>
  </div>

  <!-- Evasive No button -->
  <button
    type="button"
    class="btn no"
    [style.left]="noBtnStyle().left"
    [style.top]="noBtnStyle().top"
    [style.transition]="noBtnStyle().transition"
    (mouseenter)="dodgeOnHover()"
    (click)="onNoClick()"
    aria-label="No button"
  >
    No
  </button>

  <!-- Quote bubble -->
  @if (quoteText(); as quote) {
    <div class="quote-bubble" [style.left]="quoteStyle().left" [style.top]="quoteStyle().top">
      {{ quote }}
    </div>
  }

  <!-- Floating hearts layer -->
  <div class="hearts-layer">
    @for (h of hearts(); track h.id) {
      <div class="heart" [style.left]="h.left">❤️</div>
    }
  </div>
</div>
